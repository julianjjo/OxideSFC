name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libxdo-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: OxideSFC

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: OxideSFC/oxidesfc-frontend/package-lock.json

      # tsc typecheck + vite build; also produces dist/, which tauri-build
      # requires to exist (frontendDist) when compiling the Rust crate below.
      - name: Typecheck and build frontend
        working-directory: OxideSFC/oxidesfc-frontend
        run: |
          npm ci
          npm run build

      # --lib --bins skips the real_rom_boot integration test binary, and
      # --skip real_rom_tests filters out the frontend module tests that read
      # the real cartridge dump — CI has no ROM (it is never committed).
      # Locally, `cargo test` still runs everything and fails loudly if the
      # ROM is missing, as intended.
      - name: Run Rust tests
        working-directory: OxideSFC
        run: cargo test --workspace --lib --bins -- --skip real_rom_tests
